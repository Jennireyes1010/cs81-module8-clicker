<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cookie Clicker 🍪</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 80px;
      background-color: #f4f4f4;
      transition: background-color 0.5s;
    }

    button {
      font-size: 3rem;
      padding: 20px 40px;
      cursor: pointer;
    }

    #counter {
      font-size: 2rem;
      margin-top: 20px;
    }

    #message {
      font-size: 1.5rem;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<h1>Jenni’s Cookie Clicker 🍪</h1>

<button id="cookieBtn">🍪</button>

<div id="counter">Clicks: 0</div>

<div id="message">Start clicking the cookie!</div>
